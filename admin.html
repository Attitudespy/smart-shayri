<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Smart Shayari</title>
<style>
*{box-sizing:border-box;font-family:Segoe UI} body{background:#0f172a;color:#fff;padding:16px}
.card{background:#1e293b;padding:18px;border-radius:16px;margin:16px 0}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-top:8px}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;margin-top:12px}
.btn-purple{background:#7c3aed;color:#fff} .btn-green{background:#22c55e;color:#fff}
.login{max-width:340px;margin:60px auto;background:#1e293b;padding:24px;border-radius:20px;text-align:center}
.s-item{background:#fff;color:#111;padding:10px;border-radius:8px;margin:6px 0;font-size:13px}
</style>
</head>
<body>
<div id="loginBox" class="login">
<h3>🔐 Admin Login</h3>
<input type="password" id="pin" placeholder="PIN: thakur123">
<button class="btn-purple" onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">
<div class="card">
<h3>✒️ Nayi Shayari Add Karo</h3>
<textarea id="sText" rows="4" placeholder="Shayari likho..."></textarea>
<select id="sCat"><option>Sad</option><option>Love</option><option>Yaari</option><option>Attitude</option><option>Breakup</option></select>
<select id="sBg"><option value="#ffffff">White</option><option value="#fef3c7">Yellow</option><option value="#dcfce7">Green</option><option value="#fee2e2">Red</option><option value="#e0e7ff">Purple</option></select>
<select id="sType"><option value="FREE">FREE</option><option value="PREMIUM">PREMIUM - Ad ke baad</option></select>
<button class="btn-purple" onclick="save()">💾 Save in More Shayari</button>
</div>
<div class="card"><h4>Saved List (FREE me Phone me Stored)</h4><div id="list"></div></div>
</div>

<script>
const PIN="thakur123";
function login(){ if(pin.value===PIN){ loginBox.style.display='none'; panel.style.display='block'; render(); } else alert('Galat PIN'); }
function getDB(){ return JSON.parse(localStorage.getItem('smart_shayari_db')||'[]'); }
function setDB(a){ localStorage.setItem('smart_shayari_db', JSON.stringify(a)); }
function save(){
let t=sText.value.trim(); if(!t) return alert('Shayari likho');
let o={text:t, cat:sCat.value, bg:sBg.value, type:sType.value, likes:999, id:Date.now()};
let db=getDB(); db.unshift(o); setDB(db); sText.value=''; render(); alert('Saved!');
}
function render(){ let db=getDB(); list.innerHTML=db.map(s=>`<div class=s-item><b>${s.cat} - ${s.type}</b><br>${s.text}</div>`).join('')||'Empty'; }
</script>
</body>
</html>
