<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Shayari</title>
<style>body{font-family:sans-serif;background:#fef6f0;margin:0}.card{background:#fff;padding:15px;margin:10px;border-radius:15px;box-shadow:0 2px 8px #0001}</style>
</head><body>

<div style="padding:15px;background:#fff;position:sticky;top:0;z-index:99">
<h2>🥰 Smart Shayari</h2>
<input id="searchBox" oninput="searchShayari(this.value)" placeholder="Ex: yaad wali sad, yaari attitude..." style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd">
</div>

<div style="text-align:center;padding:10px">
<button style="background:#6c2cff;color:#fff;padding:12px 20px;border-radius:25px;border:none;width:90%">✨ Nayi Viral Shayari Banao</button>
<p style="font-size:12px;color:#888">2100+ Trending | No Timer UI | 5 Min Ad Auto</p>
</div>

<div id="grid"></div>
<div style="text-align:center;padding:20px"><button onclick="loadMore()" id="loadBtn">Load More ↓</button></div>

<script>
const qualityDB = {
Funny: ["POV: Tum single ho aur tumhara dost shaadi ka card de gaya.","Paise se khushi nahi kharid sakte, par momos to aa hi jayenge.","Subah 5 baje uthne ka plan tha, 11 baje aankh khuli.","Teacher: Sapne dekho. Me: Mam sapne me hi to tha, utha kyu diya?","Exam ke baad wala confidence: Top karunga. Result ke baad: Mama ke yahan jaunga.","Single hone ka fayda: koi 'kahan ho' puchne wala nahi.","Dost bola party de, maine bola paise de.","Zindagi me 2 cheez ignore mat karo, dusre ki story aur free WiFi","Shakal dekho aur umeed dekho shaadi ki","Log kehte hain paisa sab kuch nahi, unke paas paisa hai isliye"],
Sad: ["Hasna to sabko aata hai, has kar dard chupana humse seekho","Log kehte hain sab theek ho jayega, par kab hoga koi nahi batata","Bheed me bhi akela hu, ye kaisi tanhai hai","Raat bhar jaagta hu, sochta hu kahan galti hui","Tum khush ho apni duniya me, hum barbaad hain yaadon me"],
Attitude: ["Meri khamoshi ko kamzori mat samajh, mai toofan bhi hu sukoon bhi","Jis din apni pe aaunga, history nahi geography badal dunga","Game khatam nahi hua, bas player badla hai","Success ka wait karo, jealousy ka nahi","Hamari aukat ka andaza, hamari kamyabi se lagana"],
Motivational: ["Rukna mat, jhukna mat, jab tak manzil na mile","Log hasenge, phir dekhenge, phir kahenge isne kaise kiya","0 se start kiya hai, 100 tak jaunga, beech me rukunga nahi","Mehnat itni khamoshi se karo ki kamyabi shor macha de","Aaj thak gaya hu, par kal phir ladunga sapno ke liye"],
Love: ["Tumhare bina har subah adhoori hai","Tum mile to laga zindagi mil gayi","Tumhe dekhte hi dil bolta hai, bas yehi chahiye","Pyar me time waste nahi, life set hoti hai sahi insaan se"],
Breakup: ["Tune chhoda to kya hua, humne jeena to nahi chhoda","Thank you for leaving me, warna strong kabhi nahi banta","Breakup ke baad wali glow-up sabse khatarnak hoti hai"],
Yaari: ["Yaari ka matlab koi humse seekhe","Dost wahi jo bure time me bole, bhai mai hu na","Blood se nahi, bond se yaari hai","Asli dosti wahi jahan ek call pe aadhi raat ko aa jaye"]
};

let allShayari=[];
let id=1;
for(let cat in qualityDB){
  qualityDB[cat].forEach(text=>{
    allShayari.push({id:'s'+(id++), cat:cat, text:text, likes:1500+Math.floor(Math.random()*5000), type:'FREE'});
  });
}
// Custom DB (Admin se aaya hua)
let custom = JSON.parse(localStorage.getItem('customDB')||'[]');
allShayari = [...custom,...allShayari];

let shown=0; const perPage=20;
function renderGrid(list){
  let toRender = list || allShayari.slice(0,shown);
  grid.innerHTML = toRender.map(s=>`<div class="card"><b style="font-size:12px;color:#6c2cff">${s.cat}</b><p>${s.text}</p><div style="display:flex;justify-content:space-between;font-size:12px"><span onclick="doLike('${s.id}')">❤️ <span id="like-${s.id}">${s.likes}</span></span><span>Share →</span></div></div>`).join('');
}
function loadMore(){ shown+=perPage; renderGrid(); if(shown>=allShayari.length) loadBtn.style.display='none'; }
function searchShayari(q){
  if(!q) { renderGrid(); return; }
  q=q.toLowerCase();
  let f=allShayari.filter(s=>s.text.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q));
  renderGrid(f);
}
function doLike(id){ let l=JSON.parse(localStorage.getItem('likes')||'{}'); if(l[id]){alert('Already Liked ❤️');return;} l[id]=1; localStorage.setItem('likes',JSON.stringify(l)); let el=document.getElementById('like-'+id); el.innerText=parseInt(el.innerText)+1; }

// Visit Count for Admin
let v=parseInt(localStorage.getItem('siteVisits')||'0'); localStorage.setItem('siteVisits', v+1);

loadMore();
</script>
</body></html>
